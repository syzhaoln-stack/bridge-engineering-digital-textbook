  function render(){var v=Number(main.value),o=option.value,r=lab.calc(v,o);document.getElementById("main-out").textContent=(main.step.indexOf(".")>=0?v.toFixed((main.step.split(".")[1]||"").length):v.toFixed(0))+lab.main[5];clear();r.draw();document.getElementById("readout").innerHTML=r.m.map(function(x){return "<div><span>"+x[0]+"</span><strong>"+x[1]+"</strong></div>"}).join("");document.getElementById("formula").innerHTML="<strong>核心关系　</strong>"+r.f;document.getElementById("boundary").innerHTML="<strong>适用边界　</strong>"+r.b;document.getElementById("task").innerHTML="<strong>操作任务　</strong>"+r.q}
  main.addEventListener("input",render);option.addEventListener("change",render);document.getElementById("reset").onclick=function(){main.value=defaults.main;option.value=defaults.option;render()};document.getElementById("export").onclick=function(){exportSvg(fig,key+"-current-state.svg")};render();
})();
