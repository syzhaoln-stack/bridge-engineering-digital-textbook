.prediction{margin:0 0 11px;font-size:13px}.prediction[hidden],.chain[hidden],.guess-choices[hidden]{display:none}.guess-choices{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.guess-choices button{font:inherit;padding:7px 13px;border:1px solid #9bb7c6;border-radius:5px;background:#fff;color:var(--blue);cursor:pointer;min-height:36px}.guess-choices button:hover{background:#e4eff5}.guess-choices .skip{border-color:transparent;background:transparent;text-decoration:underline;text-underline-offset:3px}.guess-feedback{margin:0;padding:9px 11px;background:#e7f0f5;border-left:3px solid var(--blue);line-height:1.65}.guess-feedback:focus{outline:none}

<body><main class="sheet">
<header><h1 id="question"></h1><p class="lead" id="instruction"></p></header>
<nav aria-label="选择一个受力场景" class="tabs">
<button aria-pressed="true" data-scene="balance" type="button">车与桥墩</button><button aria-pressed="false" data-scene="transverse" type="button">几根梁分担</button><button aria-pressed="false" data-scene="prestress" type="button">先把梁压紧</button><button aria-pressed="false" data-scene="temperature" type="button">天气变热</button><button aria-pressed="false" data-scene="deflection" type="button">跨度与梁高</button>
</nav>

<div class="prediction" hidden="" id="prediction"><div aria-label="预测右边桥墩分担的力" class="guess-choices" id="guess-choices" role="group"><span>我猜：</span><button data-guess="50" type="button">50 kN</button><button data-guess="100" type="button">100 kN</button><button data-guess="150" type="button">150 kN</button><button class="skip" data-guess="skip" type="button">直接看结果</button></div><p class="guess-feedback" hidden="" id="guess-feedback" role="status" tabindex="-1"></p></div>

<script>
'use strict';
// 所有计算均为独立教学模型，无外部库、网络资源或规范数据库依赖。
function balanceModel(x,P=200,L=20){ // x、L: m；P、RA、RB: kN
  return {x,P,L,RA:P*(L-x)/L,RB:P*x/L};
}
function transverseModel(e,P=200,k=20){ // e、y: m；P、R: kN；k: kN/mm
  const y=[-4,-2,0,2,4], sumY2=y.reduce((s,a)=>s+a*a,0);
  const R=y.map(a=>P/5+P*e*a/sumY2); // 刚性横梁 + 五个同刚度双向弹簧
  return {e,P,k,y,R,w:R.map(r=>r/k),requiresHoldDown:R.some(r=>r< -1e-9)};
}
function prestressModel(P){ // P: kN；M: kN·m；b、h: m；应力: MPa，压为正
  const M=120,b=.30,h=.60,A=b*h,W=b*h*h/6;
  const axial=P/1000/A,bending=M/1000/W;
  return {P,M,b,h,A,W,top:axial+bending,bottom:axial-bending,threshold:M*A/W};
}
function temperatureModel(dT,locked){ // dT: °C 温差；L: m；伸长: mm；轴压力: kN
  const L=20,alpha=1e-5,E=30e9,A=.30;
  const freeExpansion=alpha*L*dT*1000;
  return {dT,locked,L,alpha,E,A,freeExpansion,extension:locked?0:freeExpansion,N:locked?E*A*alpha*dT/1000:0};
}
function deflectionModel(L,h){ // L、h、b: m；q: N/m；E: N/m²；返回挠度: mm
  const b=.4,q=10000,E=30e9,I=b*h*h*h/12;
  const at=x=>q*x*(L*L*L-2*L*x*x+x*x*x)/(24*E*I)*1000;
  const delta=at(L/2),reference=5*q*12**4/(384*E*(b*.8**3/12))*1000;
  return {L,h,b,q,E,I,delta,ratio:delta/reference,reaction:q*L/2000,curve:Array.from({length:41},(_,i)=>at(L*i/40))};
}
const $=id=>document.getElementById(id), f=(n,d=1)=>Number(n).toFixed(d);
const config={
balance:{title:'右边桥墩分担多少？',instruction:'先选一个数，也可以直接拖动车辆。',controls:[['x','车距左支座',2,18,.5,5,'m']],model:balanceModel,
equation:'R左 + R右 = P；R右 × L = P × x',assumptions:'单跨简支梁；P=200 kN 代表整车的等效集中荷载，跨度 L=20 m。只计算这辆车带来的反力，不含桥梁自重。梁在平面内静力平衡，荷载作用点位于两支座之间。',appTitle:'支座把力传给桥墩',appText:'车辆位置变了，两端需要承担的力也会变；支座与桥墩都要接住这条传力路径。'},
transverse:{title:'车靠边开，远处的梁还出力吗？',instruction:'把车轴移向一侧，看五根梁各分担多少。',controls:[['e','车轴中心偏离桥中线',-3,3,.1,1,'m']],model:transverseModel,
equation:'Rᵢ = P/5 + P e yᵢ / Σyⱼ²；wᵢ = Rᵢ/k',assumptions:'横梁视为刚体，下方五个相同的双向竖向弹簧代表主梁在该处的等效响应；yᵢ=−4、−2、0、2、4 m，k=20 kN/mm。车轴总荷载 P=200 kN，两轮各 100 kN，轮距 1.8 m。只演示刚性横梁的平移与转动，不代表真实全桥有限元结果。出现负反力时，需要双向连接才能维持此解；普通只能承压的支承会脱开，脱开后的力分配须另建模型。',appTitle:'横隔梁让主梁共同受力',appText:'车轮压在局部，横向连接帮助把力传给多根主梁；连接刚度会影响实际分配。'},
prestress:{title:'先压多大的力，下缘才刚好不受拉？',instruction:'保持弯矩不变，逐渐增加预压力，观察下缘的应力。',controls:[['P','轴向预压力',0,1800,100,600,'kN']],model:prestressModel,
equation:'σ上 = P/A + M/W；σ下 = P/A − M/W；W = b h²/6',assumptions:'线弹性、未开裂矩形截面，b=0.30 m、h=0.60 m；弯矩 M=120 kN·m 保持不变，预压力沿截面形心作用，压应力取正。不计预应力损失。算得拉应力并不等于已经开裂；实际还需结合材料抗拉性能、裂缝要求和荷载阶段判断。真实偏心预应力还会产生附加弯矩，此处未包含。',appTitle:'张拉钢束，给混凝土预压',appText:'锚具把钢束的拉力传成混凝土中的压力。本页先看轴向预压这一部分。'},
temperature:{title:'天气热了，桥需要往哪里长？',instruction:'升高温度，再试试让右端滑动，或把它卡住。',controls:[['dT','全梁升温',0,40,5,20,'°C']],model:temperatureModel,
equation:'可滑动：ΔL = α L ΔT，N = 0；完全卡住：ΔL = 0，N = E A α ΔT',assumptions:'均匀温升、线弹性直杆的轴向模型，L=20 m、α=10⁻⁵/°C、E=30 GPa、A=0.30 m²。左端限制纵向位移；右端可自由滑动，或被完全限制。忽略滑动摩擦、温度梯度、弯曲与失稳；这里只计算温度产生的纵向力。实际约束常介于两种理想情况之间。',appTitle:'可动支座留出滑动空间',appText:'支座允许梁沿桥长方向移动，桥端伸缩缝也要留下相应空间。'},
deflection:{title:'跨度变成两倍，下沉也只是两倍吗？',instruction:'分别改变跨度和梁高，看下沉的实际数值。',controls:[['L','两支座之间',8,24,1,12,'m'],['h','矩形梁截面高',.6,1.2,.1,.8,'m']],model:deflectionModel,
equation:'δ跨中 = 5qL⁴/(384EI)；I = b h³/12',assumptions:'等截面矩形简支梁；E=30 GPa、b=0.40 m、均布线荷载 q=10 kN/m 保持不变。不随截面变化重新计入自重；忽略剪切变形，采用小变形线弹性梁理论。只改跨度时挠度随 L⁴ 变化；只改高度时随 1/h³ 变化。右侧箱形构造图用于说明材料远离中性轴的作用，本页数值仍按矩形截面计算。',appTitle:'增加梁高，提高抗弯刚度',appText:'箱梁把较多材料放在截面上、下部。梁高与材料位置，共同决定抗弯刚度。'}
};
let current='balance',state={x:5,e:1,P:600,dT:20,locked:true,L:12,h:.8};
const prediction={status:'pending',initial:{x:5,P:200,L:20},choice:null};
function guessing(){return current==='balance'&&prediction.status==='pending'}
function updatePrediction(){const active=current==='balance'&&prediction.status!=='exploring';$('prediction').hidden=!active;const pending=prediction.status==='pending';$('guess-choices').hidden=!pending;$('guess-feedback').hidden=pending||!active;document.querySelector('.chain').hidden=guessing();if(active&&!pending){const q=prediction.initial,r=balanceModel(q.x,q.P,q.L);const intro=prediction.choice==='skip'?'右边是':Number(prediction.choice)===r.RB?'是':'实际是';$('guess-feedback').textContent=intro+f(r.RB,0)+' kN。车距左端 '+q.x+' m，占全跨的 1/4；右边也分担总荷载的 1/4。';}else $('guess-feedback').textContent='';if(current==='balance'){$('question').textContent=prediction.status==='exploring'?'车的位置变了，桥墩各承担多少？':config.balance.title;$('instruction').textContent=prediction.status==='exploring'?'自由移动车辆，比较左右两端的反力。':prediction.status==='pending'?config.balance.instruction:'再拖动车辆，看看分担的力怎样变化。';}}
function revealPrediction(choice){if(!guessing())return;prediction.status=choice==='skip'?'skipped':'answered';prediction.choice=choice;update();$('guess-feedback').focus({preventScroll:true});}
const defs=`<defs><marker id="force" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4 0 8Z" fill="#b84427"/></marker><marker id="move" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1L8 4.5 1 8" fill="none" stroke="#087b80" stroke-width="1.8"/></marker><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><line x1="0" y1="0" x2="0" y2="7" stroke="#a8bdc9" stroke-width="2"/></pattern></defs>`;
function text(x,y,t,cls='',anchor='start'){return `<text x="${x}" y="${y}" class="${cls}" text-anchor="${anchor}">${t}</text>`}
function line(x1,y1,x2,y2,style='stroke="#203747" stroke-width="2"'){return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" ${style}/>`}
function force(x1,y1,x2,y2){return line(x1,y1,x2,y2,'stroke="#b84427" stroke-width="3.2" marker-end="url(#force)"')}
function move(x1,y1,x2,y2){return line(x1,y1,x2,y2,'stroke="#087b80" stroke-width="2.2" stroke-dasharray="6 4" marker-end="url(#move)"')}
function dim(x1,x2,y,label){return line(x1,y,x2,y,'stroke="#748d9b" stroke-width="1"')+line(x1,y-5,x1,y+5)+line(x2,y-5,x2,y+5)+text((x1+x2)/2,y+24,label,'small','middle')}
function support(x,y,roller=false){return `<path d="M${x} ${y}l-14 21h28Z" fill="#e3ecf1" stroke="#203747" stroke-width="2"/>`+(roller?`<circle cx="${x-8}" cy="${y+26}" r="4" fill="#fff" stroke="#203747"/><circle cx="${x+8}" cy="${y+26}" r="4" fill="#fff" stroke="#203747"/>`:'')+line(x-23,y+(roller?32:25),x+23,y+(roller?32:25))}
function truck(x,y,front=false){return front?`<g transform="translate(${x} ${y})"><rect x="-52" y="-45" width="104" height="36" rx="5" fill="#386b89" stroke="#203747" stroke-width="2"/><rect x="-39" y="-39" width="78" height="15" rx="2" fill="#d9edf4"/><rect x="-49.1" y="-15" width="10" height="15" rx="3" fill="#263b46"/><rect x="39.1" y="-15" width="10" height="15" rx="3" fill="#263b46"/><path d="M-49 -15H49" stroke="#93bdcf" stroke-width="4"/></g>`:`<g transform="translate(${x} ${y})"><path d="M-48 -14v-27h52v27h29v-16l-12-13H6v29Z" fill="#386b89" stroke="#203747" stroke-width="2"/><path d="M11 -36h9l8 9H11Z" fill="#d9edf4"/><circle cx="-32" cy="-9" r="9" fill="#263b46"/><circle cx="23" cy="-9" r="9" fill="#263b46"/><circle cx="-32" cy="-9" r="4" fill="#d1dce2"/><circle cx="23" cy="-9" r="4" fill="#d1dce2"/></g>`}
function spring(x,top,bottom){let s=`M${x} ${top}L${x} ${top+5}`;for(let j=1;j<=6;j++)s+=`L${x+(j%2?8:-8)} ${top+5+(bottom-top-10)*j/7}`;return `<path d="${s}L${x} ${bottom-5}V${bottom}" fill="none" stroke="#6b8797" stroke-width="1.5"/>`}
function construction(kind){const stroke='stroke="#203747" stroke-width="2"';let a='';
if(kind==='balance')a=`<rect x="26" y="30" width="218" height="28" fill="#d3e1e8" ${stroke}/><rect x="105" y="60" width="60" height="15" fill="#386b89" ${stroke}/><path d="M84 80h102v19h-25v52h-52V99H84Z" fill="url(#hatch)" ${stroke}/>`+force(135,8,135,29)+force(135,76,135,106)+text(178,76,'支座','small')+text(173,140,'桥墩','small');
if(kind==='transverse'){a=`<path d="M25 40H245V56H25Z" fill="#d3e1e8" ${stroke}/>`;for(let i=0;i<5;i++){let x=40+i*47;a+=`<path d="M${x-11} 58h22v12h-7v52h7v12h-22v-12h7V70h-7Z" fill="#386b89" ${stroke}/>`}a+=`<rect x="24" y="83" width="222" height="18" fill="#8bafc0" ${stroke}/>`+text(135,158,'横隔梁连接主梁','small','middle');}

function renderBalance(r){const left=72,right=528,y=156,x=left+r.x/r.L*(right-left);let a=`<rect x="${left}" y="${y}" width="456" height="18" fill="#d3e1e8" stroke="#203747" stroke-width="2"/>`+truck(x,y)+support(left,y+18)+support(right,y+18,true);a+=force(x,45,x,99)+text(x,30,'200 kN','force-text','middle');a+=force(left,279,left,guessing()?213:225-r.RA*.12)+force(right,279,right,guessing()?213:225-r.RB*.12)+text(left,301,guessing()?'左支反力':'左 '+f(r.RA,0)+' kN','force-text','middle')+text(right,301,guessing()?'右支反力':'右 '+f(r.RB,0)+' kN','force-text','middle');a+=dim(left,x,218,'x = '+f(r.x)+' m')+text(300,277,'支座间 20 m','small','middle');if(guessing())a+=text(300,248,'反力暂只画方向','small','middle');return a;}
function renderTransverse(r){const xs=r.y.map(y=>300+y*49),top=163,kpx=6,ys=r.w.map(w=>top+w*kpx);let a=line(77,top,523,top,'stroke="#acbbc5" stroke-width="2" stroke-dasharray="6 5"');a+=`<path d="M77 ${top+(r.P/5+r.P*r.e*(-223/49)/40)/r.k*kpx}L523 ${top+(r.P/5+r.P*r.e*(223/49)/40)/r.k*kpx}v13L77 ${top+(r.P/5+r.P*r.e*(-223/49)/40)/r.k*kpx+13}Z" fill="#d3e1e8" stroke="#203747" stroke-width="2"/>`;const cx=300+r.e*49,cy=top+(r.P/5+r.P*r.e*r.e/40)/r.k*kpx;const angle=Math.atan((ys[4]-ys[0])/(xs[4]-xs[0]))*180/Math.PI;const wheelDx=44.1*Math.cos(angle*Math.PI/180),wheelDy=44.1*Math.sin(angle*Math.PI/180);a+=`<g transform="rotate(${angle} ${cx} ${cy})">`+truck(cx,cy,true)+`</g>`+force(cx-wheelDx,cy-wheelDy-91,cx-wheelDx,cy-wheelDy-48)+force(cx+wheelDx,cy+wheelDy-91,cx+wheelDx,cy+wheelDy-48)+text(300,31,'两轮各 100 kN','force-text','middle');xs.forEach((x,i)=>{a+=spring(x,ys[i]+14,260)+line(x-15,260,x+15,260);const v=r.R[i],len=Math.max(10,Math.abs(v)*.40);if(Math.abs(v)>.001)a+=v>=0?force(x-20,ys[i]+20+len,x-20,ys[i]+20):force(x-20,ys[i]+20,x-20,ys[i]+20+len);a+=text(x,286,(i+1)+'梁','small','middle')+text(x,309,f(v,0)+' kN',v<0?'force-text':'','middle');});const zero=r.e===0?null:-(r.P/5)/(r.P*r.e/40);if(zero!==null&&Math.abs(zero)<=4)a+=`<circle cx="${300+zero*49}" cy="${top}" r="5" fill="#087b80"/>`+text(300+zero*49,top-13,'位移为零','motion-text','middle');a+=move(560,top,560,ys[4])+text(567,130,'变形','motion-text','end');return a;}
function renderPrestress(r){let a=`<rect x="76" y="123" width="216" height="69" fill="#d3e1e8" stroke="#203747" stroke-width="2"/><line x1="68" y1="157" x2="302" y2="157" stroke="#6f8795" stroke-dasharray="6 5"/>`;if(r.P>0)a+=force(12,157,72,157)+force(356,157,296,157);a+=text(184,224,'P = '+f(r.P,0)+' kN','force-text','middle')+text(184,53,'M = 120 kN·m','force-text','middle')+`<path d="M82 112C37 89 40 65 83 65" fill="none" stroke="#b84427" stroke-width="3" marker-end="url(#force)"/><path d="M287 112C332 89 329 65 286 65" fill="none" stroke="#b84427" stroke-width="3" marker-end="url(#force)"/>`;const ax=422,t=92,b=226,scale=6,xt=ax+r.top*scale,xb=ax+r.bottom*scale;a+=line(ax,t-10,ax,b+10,'stroke="#526b79" stroke-width="1.5"');if(r.bottom>=0)a+=`<path d="M${ax} ${t}H${xt}L${xb} ${b}H${ax}Z" fill="#c8e6e1" stroke="#087b80" stroke-width="2"/>`;else{const zy=t+(b-t)*r.top/(r.top-r.bottom);a+=`<path d="M${ax} ${t}H${xt}L${ax} ${zy}Z" fill="#c8e6e1" stroke="#087b80" stroke-width="2"/><path d="M${ax} ${zy}L${xb} ${b}H${ax}Z" fill="#f3cdbf" stroke="#b84427" stroke-width="2"/>`;}a+=text(424,59,'上缘压 '+f(r.top)+' MPa','','middle')+text(446,273,Math.abs(r.bottom)<1e-8?'下缘应力为零':('下缘'+(r.bottom<0?'拉 ':'压 ')+f(Math.abs(r.bottom))+' MPa'),r.bottom<0?'force-text':'motion-text','middle')+text(422,304,'色块宽度表示应力','small','middle');return a;}
function renderTemperature(r){const left=78,oldRight=478,newRight=oldRight+r.extension*6;let a=`<rect x="${left}" y="128" width="${newRight-left}" height="38" fill="#d3e1e8" stroke="#203747" stroke-width="2"/>`+support(left,166)+support(oldRight,166,true);a+=line(oldRight,101,oldRight,176,'stroke="#869dab" stroke-width="1.5" stroke-dasharray="5 4"')+text(300,33,'全梁升温 '+f(r.dT,0)+' °C','','middle')+dim(left,oldRight,244,'原长 20 m');if(r.locked){a+=`<path d="M64 119h12v63H64ZM482 119h12v63h-12Z" fill="url(#hatch)" stroke="#203747"/>`;if(r.N>0)a+=force(14,147,74,147)+force(580,147,480,147);a+=text(300,85,'轴向压力 '+f(r.N,0)+' kN','force-text','middle')+text(300,219,'伸长被阻止：0 mm','motion-text','middle');}else{if(r.extension>.001)a+=move(oldRight,82,newRight,82);a+=text(300,85,'自由伸长 '+f(r.extension)+' mm','motion-text','middle')+text(300,219,'纵向约束力为 0','force-text','middle');}return a;}
function renderDeflection(r){const span=r.L*18,left=300-span/2,right=300+span/2,base=128,gain=Math.min(6,77/r.delta),amp=r.delta*gain;let a=line(left,base,right,base,'stroke="#a5b7c2" stroke-width="2" stroke-dasharray="6 5"');let path=r.curve.map((v,i)=>(i?'L':'M')+(left+span*i/40)+' '+(base+v*gain)).join(' ');a+=`<path d="${path}" fill="none" stroke="#386b89" stroke-width="${r.h*14}"/>`+support(left,base+8)+support(right,base+8,true);for(let i=0;i<=5;i++){const x=left+span*i/5;const px=r.L*i/5;const w=r.q*px*(r.L**3-2*r.L*px*px+px**3)/(24*r.E*r.I)*1000;a+=force(x,base+w*gain-59,x,base+w*gain-15);}a+=text(300,33,'均布荷载 10 kN/m','force-text','middle');a+=force(left,222,left,171)+force(right,222,right,179)+text(left,245,f(r.reaction,0)+' kN','force-text','middle')+text(right,245,f(r.reaction,0)+' kN','force-text','middle');a+=move(300,base,300,base+amp)+text(300,base+amp+34,'下沉 '+f(r.delta)+' mm','motion-text','middle')+dim(left,right,274,'跨度 '+f(r.L,0)+' m');return a;}
function update(){const c=config[current];let r;if(current==='balance')r=balanceModel(state.x);if(current==='transverse')r=transverseModel(state.e);if(current==='prestress')r=prestressModel(state.P);if(current==='temperature')r=temperatureModel(state.dT,state.locked);if(current==='deflection')r=deflectionModel(state.L,state.h);let cause,effect,use,notice='';
if(current==='balance'){cause='车距左端 '+f(r.x)+' m';effect=guessing()?'右边分担多少，先猜一次':r.x===10?'两端各承担 100 kN':(r.x>10?'右':'左')+'端承担更多';use=guessing()?'选择或拖动车辆后查看':'支座反力传到桥墩';}
if(current==='transverse'){cause='车轴偏离中线 '+f(Math.abs(r.e))+' m';effect='最多一根分担 '+f(Math.max(...r.R)/r.P*100,0)+'%';use='横向连接帮助多梁分担';if(r.requiresHoldDown)notice='这里有向下的负反力：它需要能抗拔的连接。普通只能承压的支承会脱开，此后不能继续沿用这组分配值。';}
if(current==='prestress'){cause='轴向预压力 '+f(r.P,0)+' kN';effect=Math.abs(r.bottom)<1e-8?'下缘刚好不受拉':r.bottom<0?'下缘拉应力还剩 '+f(-r.bottom)+' MPa':'下缘转为受压';use='锚具把钢束拉力传成预压力';}
if(current==='temperature'){cause='升温 '+f(r.dT,0)+' °C；'+(r.locked?'右端卡住':'右端可滑动');effect=r.locked?'不能伸长，产生 '+f(r.N,0)+' kN 压力':'伸长 '+f(r.extension)+' mm';use='可动支座与伸缩缝留出位移';}
if(current==='deflection'){cause='跨度 '+f(r.L,0)+' m；梁高 '+f(r.h)+' m';effect='下沉为初始梁的 '+f(r.ratio,2)+' 倍';use='梁高影响材料到中性轴的距离';}
updatePrediction();$('cause').textContent=cause;$('effect').textContent=effect;$('use').textContent=use;$('notice').hidden=!notice;$('notice').textContent=notice;
const draws={balance:renderBalance,transverse:renderTransverse,prestress:renderPrestress,temperature:renderTemperature,deflection:renderDeflection};$('scene').innerHTML='<title id="diagram-title">'+c.title+'</title><desc id="diagram-desc">'+cause+'。'+effect+'。'+(notice||'实线箭头是力；虚线箭头是放大的位移。')+'</desc>'+defs+draws[current](r);c.controls.forEach(([id,,,,,,unit])=>{const out=$('out-'+id);if(out)out.textContent=f(state[id],['x','e','h'].includes(id)?1:0)+' '+unit;});window.principleArrows={scene:current,state:{...state},result:r,prediction:{...prediction,initial:{...prediction.initial}}};reportHeight();}
function selectScene(name){current=name;const c=config[name];$('question').textContent=c.title;$('instruction').textContent=c.instruction;document.querySelectorAll('[data-scene]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.scene===name)));$('controls').innerHTML=c.controls.map(([id,label,min,max,step,initial,unit])=>`<label class="control" for="control-${id}"><span>${label}</span><input id="control-${id}" type="range" min="${min}" max="${max}" step="${step}" value="${state[id]}" aria-describedby="out-${id}"><output id="out-${id}" for="control-${id}"></output></label>`).join('');if(name==='temperature')$('controls').insertAdjacentHTML('beforeend',`<div class="switch" role="group" aria-label="右端纵向约束"><button type="button" data-locked="false" aria-pressed="${!state.locked}">允许滑动</button><button type="button" data-locked="true" aria-pressed="${state.locked}">完全卡住</button></div>`);c.controls.forEach(([id])=>$('control-'+id).addEventListener('input',e=>{state[id]=Number(e.target.value);if(current==='balance'&&id==='x')prediction.status='exploring';update();}));document.querySelectorAll('[data-locked]').forEach(b=>b.addEventListener('click',()=>{state.locked=b.dataset.locked==='true';document.querySelectorAll('[data-locked]').forEach(el=>el.setAttribute('aria-pressed',String((el.dataset.locked==='true')===state.locked)));update();}));$('construction').innerHTML=construction(name);$('app-title').textContent=c.appTitle;$('app-text').textContent=c.appText;$('equation').textContent=c.equation;$('assumptions').textContent=c.assumptions;$('source-code').textContent=c.model.toString();$('formula-details').open=false;$('code-details').open=false;update();}
let lastHeight=0;function reportHeight(){requestAnimationFrame(()=>{const height=Math.ceil(document.querySelector('.sheet').getBoundingClientRect().height);if(height!==lastHeight){lastHeight=height;window.parent.postMessage({type:'principle-arrows-height',height},'*');}})}
document.querySelectorAll('[data-guess]').forEach(b=>b.addEventListener('click',()=>revealPrediction(b.dataset.guess)));
document.querySelectorAll('[data-scene]').forEach(b=>b.addEventListener('click',()=>selectScene(b.dataset.scene)));document.querySelectorAll('details').forEach(d=>d.addEventListener('toggle',reportHeight));new ResizeObserver(reportHeight).observe(document.querySelector('.sheet'));window.addEventListener('resize',reportHeight);selectScene('balance');
