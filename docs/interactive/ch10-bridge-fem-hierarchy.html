<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><link href="data:," rel="icon"/><title>桥梁构件怎样进入有限元</title><style>
:root{--paper:#f7f9f9;--ink:#102a36;--muted:#60737b;--line:#d6e1e3;--cyan:#1f8fa8;--amber:#e69b36;--coral:#c85c4a;--panel:#fff}
*{box-sizing:border-box}html,body{margin:0;min-width:0;font-family:"Microsoft YaHei","Segoe UI",sans-serif;background:var(--paper);color:var(--ink)}body{padding:12px}.lab-shell{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1.65fr) minmax(290px,.78fr);gap:12px;align-items:start}.learning-slot,.learning-result,.model-note{grid-column:1/-1}.scene-panel,.desk,.model-note{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 30px rgba(16,42,54,.08)}
.scene-panel{overflow:hidden}.scene-head{padding:14px 16px 12px;border-bottom:1px solid var(--line)}.eyebrow{font-size:10px;letter-spacing:.12em;color:#397080;font-weight:700}.scene-head h1{font:600 20px/1.35 "STKaiti","KaiTi",serif;margin:4px 0}.scene-head p{font-size:12px;line-height:1.58;color:var(--muted);margin:5px 0}.modes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-top:10px}button{min-height:44px;border:1px solid #c7d5d8;border-radius:8px;background:#eef3f4;color:var(--ink);padding:8px 7px;font-size:10px;cursor:pointer}button.active{border-color:var(--cyan);background:#dff1f4}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid rgba(31,143,168,.28);outline-offset:2px}
#scene{position:relative;width:100%;height:550px;overflow:hidden;background:#819eaf}#scene canvas{display:block;width:100%!important;height:100%!important}.label{position:absolute;z-index:4;transform:translate(-50%,-50%);background:rgba(7,15,21,.84);border:1px solid rgba(255,255,255,.15);border-radius:5px;padding:3px 5px;font-size:10px;white-space:nowrap;pointer-events:none}.note{position:absolute;z-index:4;left:50%;bottom:10px;transform:translateX(-50%);font-size:9px;color:#e4edef;background:rgba(9,18,25,.84);border:1px solid rgba(255,255,255,.14);border-radius:6px;padding:6px 9px;white-space:nowrap}#loading{position:absolute;inset:0;z-index:9;display:grid;place-items:center;background:#0b151d;color:#eef4f5}
.desk{padding:15px;background:#fbfcfc}.desk h2{font-size:15px;margin:0 0 4px}.desk>p{font-size:11px;color:var(--muted);line-height:1.5;margin:0 0 10px}.control-grid{display:grid;grid-template-columns:1fr;gap:8px}.row{min-width:0;padding:9px;border:1px solid var(--line);border-radius:9px;background:#fff}.row label{display:flex;justify-content:space-between;gap:6px;font-size:10px;color:#4f626a}.row output{color:var(--cyan);font-weight:700}.row input,.row select{width:100%;accent-color:var(--cyan)}.row input{height:44px;margin:0}.row select{min-height:44px;margin-top:7px;border:1px solid #c7d5d8;border-radius:8px;background:#eef3f4;color:var(--ink);padding:7px}.readouts{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.readout{min-width:0;background:#eef3f4;border:1px solid var(--line);border-radius:8px;padding:8px}.readout span{display:block;color:var(--muted);font-size:9px}.readout b{font-size:13px;color:#9b6219;overflow-wrap:anywhere}
.model-note{padding:14px 16px;border-top:3px solid var(--cyan)}.model-note::before{content:"E  模型不是桥的照片，是一个问题的答题器";display:block;margin-bottom:8px;font-size:10px;font-weight:700;letter-spacing:.1em;color:#397080}.map h2{font-size:14px;margin:0 0 8px;color:#294650}.mapping{display:grid;grid-template-columns:minmax(80px,.82fr) minmax(98px,.95fr) minmax(0,1.8fr);font-size:10px;border-bottom:1px solid var(--line)}.mapping div{min-width:0;border-top:1px solid var(--line);padding:7px 6px;overflow-wrap:anywhere}.mapping .hd{color:var(--muted);font-weight:700}.mapping b{color:#166f84}.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:9px;color:var(--muted);margin-top:8px}.sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px}.insight{font:15px/1.6 "STKaiti","KaiTi",serif;color:#294650;margin-top:11px}.boundary{font-size:11px;line-height:1.65;color:#52676f;margin-top:7px}.boundary::before{content:"模型边界：";font-weight:700;color:#9b6219}
@media(max-width:860px){body{padding:8px}.lab-shell{grid-template-columns:1fr}.scene-panel,.desk{grid-column:1}#scene{height:470px}.control-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.readouts{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:560px){.scene-head{padding:12px}.scene-head h1{font-size:18px}.scene-head p{font-size:11px}.modes{grid-template-columns:1fr 1fr}#scene{height:390px}.control-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.readouts{grid-template-columns:repeat(2,minmax(0,1fr))}.note,.label{display:none!important}.desk,.model-note{padding:12px}.mapping{grid-template-columns:minmax(70px,.8fr) minmax(78px,.9fr) minmax(0,1.6fr);font-size:9px}.mapping div{padding:6px 4px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main class="lab-shell"><section class="learning-slot" data-learning-cycle-mount=""></section><section aria-labelledby="scene-title" class="scene-panel" data-lab-scene=""><header class="scene-head"><div class="eyebrow">BRIDGE → FEM / MODEL HIERARCHY</div><h1 id="scene-title">从一段桥面到一座全桥，模型怎样逐层展开？</h1><p>前三层盯住同一段桥面，比较板、纵梁与横梁怎样进入模型；混合层再加入桥塔、拉索和基础。每层只保留回答当前问题所需的东西。</p><div class="modes"><button class="active" data-mode="physical" type="button">桥面构件</button><button data-mode="grillage" type="button">纵横梁格</button><button data-mode="shell" type="button">板壳网格</button><button data-mode="hybrid" type="button">索桥混合全桥</button></div></header><div id="scene"><div id="loading">正在建立构件—单元对应关系……</div><div class="note">x 桥向 · y 横桥向 · z 竖向｜旋转观察构件与单元的对应位置</div></div></section><aside aria-labelledby="control-title" class="desk" data-lab-controls=""><h2 id="control-title">物理尺寸与离散方式</h2><p>先问清楚要看整体、横向分配还是局部，再选模型层级。</p><div class="control-grid"><div class="row"><label>模型全长 L <output id="o-span">180 m</output></label><input id="span" max="240" min="60" step="20" type="range" value="180"/></div><div class="row"><label>横梁间距 <output id="o-cross">12 m</output></label><input id="cross" max="24" min="4" step="2" type="range" value="12"/></div><div class="row"><label>车辆横向位置 y <output id="o-loadY">2.0 m</output></label><input id="loadY" max="5" min="-5" step=".25" type="range" value="2"/></div><div class="row"><label>板壳网格</label><select id="mesh"><option value="8,3">8 × 3</option><option value="12,4">12 × 4</option><option selected="" value="18,6">18 × 6</option></select></div></div><div class="readouts" id="readouts"></div></aside><section class="learning-result" data-learning-result-mount=""></section><section class="model-note"><section class="map"><h2>构件在模型里换成了什么</h2><div class="mapping" id="mapping"></div><div class="legend"><span><i class="sw" style="background:#6dcfe7"></i>板壳 shell4</span><span><i class="sw" style="background:#e7b45c"></i>空间梁 frame3d</span><span><i class="sw" style="background:#ed7b55"></i>杆/索 truss3d</span><span><i class="sw" style="background:#86d49e"></i>节点/连接</span></div></section><div class="insight" id="insight"></div><div class="boundary" id="boundary"></div></section></main>
