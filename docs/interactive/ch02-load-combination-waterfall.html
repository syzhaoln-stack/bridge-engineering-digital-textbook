<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><link href="data:," rel="icon"/><title>作用效应组合瀑布图</title>
<style>:root{--blue:#17365d;--cyan:#168aad;--orange:#e67e22;--grey:#697f93;--paper:#f5f8fa}*{box-sizing:border-box}body{margin:0;padding:16px;background:var(--paper);font:14px/1.6 "Microsoft YaHei",sans-serif;color:#273444}.shell{max-width:1120px;margin:auto}.head{background:white;border-left:5px solid var(--blue);padding:14px 18px}.head h1{margin:0;color:var(--blue);font-size:24px}.head p{margin:5px 0 0;color:#617283}.grid{display:grid;grid-template-columns:1fr 300px;gap:14px;margin-top:14px}.card{background:white;border:1px solid #d6e0e7;border-radius:10px;padding:14px}svg{width:100%;height:500px}.row{margin:12px 0}.row label{display:block;font-weight:600}.row input,.row select{width:100%;margin-top:6px;padding:7px;accent-color:var(--cyan)}.formula{border-left:4px solid var(--orange);background:#fff8ef;padding:10px;margin-top:12px}.metric{display:flex;justify-content:space-between;margin:8px 0;padding:8px;background:#eef4f7}.metric b{color:var(--blue)}@media(max-width:760px){.grid{grid-template-columns:1fr}svg{height:430px}}</style></head><body><main class="shell">
<section class="head"><h1>作用效应组合瀑布图</h1><p>同一控制截面、同一效应分量采用统一正负号。各柱从前一项终点继续，末柱为组合总效应。</p></section><div class="grid"><section class="card"><svg aria-label="作用效应组合瀑布图" id="chart" viewbox="0 0 820 500"></svg></section><aside class="card">
<div class="formula"><strong>参数口径</strong><br/>组合类型：承载能力极限状态基本组合的算法示意。<br/>采用标准／版本／条文：未指定。当前 γ、ψ 和作用效应均为“教学参数集 A”，不作为工程取值。</div>
<div class="row"><label>主导可变作用</label><select id="lead"><option value="traffic">车辆作用</option><option value="crowd">人群作用</option><option value="wind">风作用</option><option value="temp">温度作用</option></select></div>
<div class="row"><label>可变作用效应倍率 <output id="os">1.00</output></label><input id="scale" max="1.5" min="0.6" step="0.05" type="range" value="1"/></div>
<div id="metrics"></div><div class="formula">教学表达：S<sub>d</sub>=Σγ<sub>G</sub>S<sub>Gk</sub>+κ<sub>Q</sub>[γ<sub>Q1</sub>S<sub>Q1k</sub>+Σγ<sub>Qj</sub>ψ<sub>j</sub>S<sub>Qjk</sub>]。<br/>κ<sub>Q</sub>仅为本页的情景倍率，用于灵敏度观察，不属于规范组合系数。工程设计必须据采用的现行标准、版本和相应条文重建参数集。</div></aside></div></main>
<script>const $=id=>document.getElementById(id),A=[{id:'g1',name:'结构自重',kind:'G',Ek:105,psi:1},{id:'g2',name:'铺装附属',kind:'G',Ek:25,psi:1},{id:'traffic',name:'车辆',kind:'Q',Ek:80,psi:.70},{id:'crowd',name:'人群',kind:'Q',Ek:30,psi:.70},{id:'wind',name:'风',kind:'Q',Ek:15,psi:.60},{id:'temp',name:'温度',kind:'Q',Ek:-22,psi:.60}];let lead='traffic',scale=1;
function render(){const data=A.map(a=>{const gamma=a.kind==='G'?1.2:1.4,psi=a.kind==='G'||a.id===lead?1:a.psi,kappa=a.kind==='G'?1:scale,v=a.Ek*gamma*psi*kappa;return{...a,gamma,psi,kappa,v}});let sum=0;data.forEach(d=>{d.from=sum;sum+=d.v;d.to=sum});const s=$('chart'),left=65,base=430,step=105,bw=62,all=[0,...data.flatMap(d=>[d.from,d.to]),sum],mn=Math.min(...all),mx=Math.max(...all),span=Math.max(1,mx-mn),Y=v=>50+(mx-v)/span*330;s.innerHTML='';const E=(n,a,t='')=>{const e=document.createElementNS('http://www.w3.org/2000/svg',n);Object.entries(a).forEach(([k,v])=>e.setAttribute(k,v));e.textContent=t;s.append(e);return e};E('line',{x1:left-25,y1:Y(0),x2:790,y2:Y(0),stroke:'#8798a6'});E('text',{x:405,y:26,'text-anchor':'middle',fill:'#617283','font-size':12},'教学参数集 A；柱下注明 γ×ψ×κQ（永久作用 κQ=1）');data.forEach((d,i)=>{const x=left+i*step,y=Math.min(Y(d.from),Y(d.to)),h=Math.max(2,Math.abs(Y(d.from)-Y(d.to))),color=d.kind==='G'?'#697f93':d.id===lead?'#e67e22':'#8fc2ce';E('rect',{x,y,width:bw,height:h,rx:4,fill:color});E('text',{x:x+bw/2,y:base,'text-anchor':'middle',fill:'#344b5f','font-size':12},d.name);E('text',{x:x+bw/2,y:y-8,'text-anchor':'middle',fill:'#17365d','font-size':12},(d.v>=0?'+':'')+d.v.toFixed(1));E('text',{x:x+bw/2,y:base+18,'text-anchor':'middle',fill:'#6d7e8b','font-size':10},`${d.gamma.toFixed(2)}×${d.psi.toFixed(2)}×${d.kappa.toFixed(2)}`);if(i<data.length-1)E('line',{x1:x+bw,y1:Y(d.to),x2:x+step,y2:Y(d.to),stroke:'#aab6be','stroke-dasharray':'4 4'})});const x=left+data.length*step,y=Math.min(Y(0),Y(sum)),h=Math.max(2,Math.abs(Y(0)-Y(sum)));E('rect',{x,y,width:bw,height:h,rx:4,fill:'#168aad'});E('text',{x:x+bw/2,y:base,'text-anchor':'middle',fill:'#344b5f','font-size':12},'组合合计');E('text',{x:x+bw/2,y:y-8,'text-anchor':'middle',fill:'#17365d','font-size':13,'font-weight':700},sum.toFixed(1));$('metrics').innerHTML=`<div class="metric"><span>情景倍率 κQ</span><b>${scale.toFixed(2)}</b></div><div class="metric"><span>永久作用合计</span><b>${data.filter(d=>d.kind==='G').reduce((a,d)=>a+d.v,0).toFixed(1)} MN·m</b></div><div class="metric"><span>主导作用贡献</span><b>${data.find(d=>d.id===lead).v.toFixed(1)} MN·m</b></div><div class="metric"><span>组合总效应</span><b>${sum.toFixed(1)} MN·m</b></div>`;$('os').textContent=scale.toFixed(2)}
$('lead').onchange=e=>{lead=e.target.value;render()};$('scale').oninput=e=>{scale=+e.target.value;render()};render();</script>
