<!DOCTYPE html>

<html lang="zh-CN"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>预应力等效作用与截面状态</title><link href="bridge-lab.css" rel="stylesheet"/></head>
<body><main>
<header><div><h1>预应力等效作用与截面状态</h1><p>以静定简支梁为解析基准，区分预应力单独作用、传力阶段和成桥使用状态，并联动钢束线形、等效荷载、跨中弯矩与上下缘应力。</p></div><div class="toolbar"><button id="reset">恢复教学值</button><button id="export">导出当前图（SVG）</button></div></header>
<section class="layout"><div class="controls"><h2>模型参数</h2>
<div class="control"><label for="stage"><span>计算状态</span></label><select id="stage"><option value="prestress">预应力单独作用（分解项）</option><option value="transfer">传力阶段</option><option selected="" value="service">成桥使用状态</option></select></div>
<div class="control"><label for="L"><span>计算跨径 L</span><output id="L-out"></output></label><input data-unit=" m" id="L" max="60" min="20" step="2" type="range" value="40"/></div>
<div class="control"><label for="wg"><span>梁体自重等效均布作用 g</span><output id="wg-out"></output></label><input data-unit=" kN/m" id="wg" max="160" min="20" step="5" type="range" value="80"/></div>
<div class="control"><label for="wq"><span>使用阶段附加均布作用 q</span><output id="wq-out"></output></label><input data-unit=" kN/m" id="wq" max="100" min="0" step="5" type="range" value="30"/></div>
<div class="control"><label for="P"><span>张拉控制力 P₀</span><output id="P-out"></output></label><input data-unit=" kN" id="P" max="12000" min="2000" step="250" type="range" value="7000"/></div>
<div class="control"><label for="eta"><span>使用阶段有效预应力系数 η</span><output id="eta-out"></output></label><input data-unit="" id="eta" max="0.92" min="0.60" step="0.01" type="range" value="0.82"/></div>
<div class="control"><label for="e"><span>跨中向下偏心 e</span><output id="e-out"></output></label><input data-unit=" m" id="e" max="1.2" min="0" step="0.05" type="range" value="0.65"/></div>
<div class="task"><strong>观察任务：</strong>比较改变 P 与改变 e 的结果，再切换计算状态。说明“预压力”和“抵消外作用弯矩”分别由公式中的哪一项控制。</div>
</div><div class="visual"><h2>状态分解与弯矩抵消</h2><svg aria-label="曲线预应力束、等效作用、弯矩分解与截面应力" class="figure" id="scene" role="img" viewbox="0 0 860 500"></svg>
<div class="metrics" id="metrics"></div><div class="formula" id="formula"></div>
<div class="boundary">边界：均质线弹性、对称截面、静定简支梁、抛物线束且 P 沿程不变；固定教学截面 A=6.20 m²、I=7.80 m⁴、h=2.60 m。传力阶段暂取 P<sub>tr</sub>=0.92P₀，并计梁体自重 g；使用状态取 P<sub>e</sub>=ηP₀，并计 g+q。未计锚固区、摩阻沿程变化、徐变收缩、开裂及超静定次内力。</div></div></section>
</main><script src="bridge-lab-utils.js"></script><script>
const svg=document.getElementById('scene'),metrics=document.getElementById('metrics'),formula=document.getElementById('formula'),NS='http://www.w3.org/2000/svg';const initial={stage:'service',L:40,wg:80,wq:30,P:7000,eta:.82,e:.65},state={...initial};
function el(tag,a={},t=''){const n=document.createElementNS(NS,tag);Object.entries(a).forEach(([k,v])=>n.setAttribute(k,v));if(t)n.textContent=t;svg.appendChild(n);return n}
function defs(){const d=el('defs');for(const [id,color] of [['arrow','#c7632d'],['bluearrow','#146c94']]){const m=document.createElementNS(NS,'marker');Object.entries({id,viewBox:'0 0 10 10',refX:8,refY:5,markerWidth:6,markerHeight:6,orient:'auto'}).forEach(([k,v])=>m.setAttribute(k,v));const p=document.createElementNS(NS,'path');p.setAttribute('d','M0 0L10 5L0 10z');p.setAttribute('fill',color);m.appendChild(p);d.appendChild(m)}}
function arrow(x1,y1,x2,y2,cls='force',marker='arrow'){el('line',{x1,y1,x2,y2,class:cls,'marker-end':`url(#${marker})`})}
function render(){svg.innerHTML='';defs();const factor=state.stage==='prestress'?1:(state.stage==='transfer'?0.92:state.eta);const Peff=state.P*factor;const w=state.stage==='prestress'?0:state.stage==='transfer'?state.wg:state.wg+state.wq;const wp=8*Peff*state.e/(state.L*state.L),Vp=wp*state.L/2;const Mg=w*state.L*state.L/8;const Mp=Peff*state.e;const M=Mg-Mp;const A=6.2,I=7.8,H=2.6,y=H/2;const top=(-Peff/A-M*y/I)/1000,bottom=(-Peff/A+M*y/I)/1000;
  const x1=55,x2=525,ym=150;el('line',{x1,y1:ym,x2,y2:ym,class:'structure'});el('polygon',{points:`${x1},${ym+3} ${x1-15},${ym+24} ${x1+15},${ym+24}`,class:'support'});el('polygon',{points:`${x2},${ym+3} ${x2-15},${ym+24} ${x2+15},${ym+24}`,class:'support'});
  let d='';for(let i=0;i<=80;i++){const u=i/80,x=x1+u*(x2-x1),yy=ym+10+65*4*u*(1-u)*state.e/1.2;d+=(i?'L':'M')+x.toFixed(1)+','+yy.toFixed(1)}el('path',{d,class:'reaction'});el('text',{x:290,y:247,'text-anchor':'middle',class:'small'},`抛物线束：跨中偏心 e = ${state.e.toFixed(2)} m`);
  if(w>0){for(let i=0;i<10;i++){const x=x1+25+i*47;arrow(x,55,x,116,'force','arrow')}}const stageLabel=state.stage==='prestress'?'预应力单独作用：外作用分解项取 0':state.stage==='transfer'?`传力阶段：梁体自重 g = ${w.toFixed(0)} kN/m`:`使用状态：g+q = ${w.toFixed(0)} kN/m`;el('text',{x:290,y:43,'text-anchor':'middle',class:'label'},stageLabel);
  for(let i=0;i<8;i++){const x=x1+40+i*56;arrow(x,285,x,258,'reaction','bluearrow')}arrow(x1,258,x1,292,'reaction','bluearrow');arrow(x2,258,x2,292,'reaction','bluearrow');arrow(x1-4,330,x1+55,330,'reaction','bluearrow');arrow(x2+4,330,x2-55,330,'reaction','bluearrow');el('text',{x:290,y:310,'text-anchor':'middle',class:'label'},`束的等效荷载：wₚ=${wp.toFixed(2)} kN/m；端部竖向分力各 Vₚ=${Vp.toFixed(1)} kN`);el('text',{x:290,y:352,'text-anchor':'middle',class:'small'},`端部水平锚固力各约为 P=${Peff.toFixed(0)} kN；全部等效荷载共同构成自平衡体系`);
  const bx=590,by=55,bw=220,bh=165,maxM=Math.max(1,Math.abs(Mg),Math.abs(Mp),Math.abs(M));const bars=[['外作用 M_g',Mg,'#c7632d'],['预应力 −M_p',-Mp,'#146c94'],['合计 M',M,'#2d7b68']];el('line',{x1:bx,y1:by+bh/2,x2:bx+bw,y2:by+bh/2,class:'axis'});bars.forEach(([lab,val,c],i)=>{const x=bx+18+i*70,hv=Math.abs(val)/maxM*66,y0=by+bh/2-(val>=0?hv:0);el('rect',{x,y:y0,width:38,height:hv,fill:c,opacity:.85});el('text',{x:x+19,y:by+bh+18,'text-anchor':'middle',class:'small'},lab);el('text',{x:x+19,y:val>=0?y0-6:y0+hv+16,'text-anchor':'middle',class:'small'},val.toFixed(0))});el('text',{x:700,y:34,'text-anchor':'middle',class:'label'},'跨中弯矩分解 / kN·m');
  const cx=610,cy=300,cw=90,ch=155;el('rect',{x:cx,y:cy,width:cw,height:ch,class:'solid'});el('line',{x1:cx+cw/2,y1:cy,x2:cx+cw/2,y2:cy+ch,class:'axis','stroke-dasharray':'4 3'});const scale=75/Math.max(1,Math.abs(top),Math.abs(bottom)),xTop=cx+cw+top*scale,xBot=cx+cw+bottom*scale;el('line',{x1:cx+cw,y1:cy,x2:xTop,y2:cy,class:'curve2'});el('line',{x1:xTop,y1:cy,x2:xBot,y2:cy+ch,class:'curve2'});el('line',{x1:xBot,y1:cy+ch,x2:cx+cw,y2:cy+ch,class:'curve2'});el('text',{x:748,y:292,class:'label'},'截面应力 / MPa');el('text',{x:712,y:cy+5,class:'small'},`顶 ${top.toFixed(2)}`);el('text',{x:712,y:cy+ch,class:'small'},`底 ${bottom.toFixed(2)}`);el('text',{x:610,y:480,class:'small'},'负值为压应力；A=6.20 m²，I=7.80 m⁴，h=2.60 m。');
  const pName=state.stage==='prestress'?'张拉控制力 P₀':state.stage==='transfer'?'传力预应力 Pₜᵣ':'有效预应力 Pₑ';metrics.innerHTML=[[pName,`${Peff.toFixed(0)} kN`],['外作用弯矩 M_g',`${Mg.toFixed(0)} kN·m`],['预应力弯矩 P e',`${Mp.toFixed(0)} kN·m`],['合计弯矩 M',`${M.toFixed(0)} kN·m`]].map(([k,v])=>`<div class="metric"><span>${k}</span><strong>${v}</strong></div>`).join('');formula.innerHTML=`e(x)=4e·x(L−x)/L²；&nbsp; w<sub>p</sub>=8Pe/L²；&nbsp; V<sub>p</sub>=w<sub>p</sub>L/2=4Pe/L；&nbsp; M<sub>g</sub>=wL²/8；&nbsp; M=M<sub>g</sub>−Pe；&nbsp; σ(y)=−P/A−My/I。`;
}
for(const id of ['L','wg','wq','P','eta','e'])bindRange(state,id,render);bindSelect(state,'stage',render);document.getElementById('reset').onclick=()=>{Object.assign(state,initial);for(const id of ['L','wg','wq','P','eta','e']){document.getElementById(id).value=state[id];document.getElementById(id).dispatchEvent(new Event('input'))}document.getElementById('stage').value=state.stage;render()};document.getElementById('export').onclick=()=>exportSvg(svg,'预应力等效作用与截面状态.svg');render();
</script>
