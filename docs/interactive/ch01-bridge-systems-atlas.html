<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><link href="data:," rel="icon"/><title>桥型三维参数图谱</title>
<style>
:root{--paper:#f7f9f9;--ink:#102a36;--muted:#60737b;--line:#d6e1e3;--cyan:#1f8fa8;--amber:#e69b36;--coral:#c85c4a;--panel:#fff}
*{box-sizing:border-box}html,body{margin:0;min-width:0;font-family:"Microsoft YaHei","Segoe UI",sans-serif;background:var(--paper);color:var(--ink)}body{padding:12px}.lab-shell{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1.65fr) minmax(290px,.78fr);gap:12px;align-items:start}.learning-slot,.learning-result,.model-note{grid-column:1/-1}.scene-panel,.controls,.model-note{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 30px rgba(16,42,54,.08)}
.scene-panel{overflow:hidden}.scene-head{padding:14px 16px 12px;border-bottom:1px solid var(--line)}.eyebrow{font-size:10px;color:#397080;letter-spacing:.12em;font-weight:700}.scene-head h1{font-family:"STKaiti","KaiTi",serif;font-size:20px;font-weight:600;line-height:1.35;margin:4px 0}.scene-head p{font-size:12px;color:var(--muted);line-height:1.58;margin:5px 0}.scene-task{border-left:2px solid var(--amber);padding-left:9px;color:#35505b!important}.scene-task strong{color:#9b6219}.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}button,select{min-height:44px;background:#eef3f4;border:1px solid #c7d5d8;border-radius:8px;color:var(--ink);padding:8px 10px;font-size:11px;cursor:pointer}button.active{border-color:var(--cyan);background:#dff1f4}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid rgba(31,143,168,.28);outline-offset:2px}
#scene{position:relative;width:100%;height:550px;overflow:hidden;background:#7794a7}#scene canvas{display:block;width:100%!important;height:100%!important}.label{position:absolute;z-index:4;transform:translate(-50%,-50%);background:rgba(7,14,20,.84);border:1px solid rgba(255,255,255,.16);border-radius:5px;padding:3px 5px;font-size:10px;pointer-events:none;white-space:nowrap}.note{position:absolute;z-index:4;left:50%;bottom:10px;transform:translateX(-50%);font-size:10px;color:#e5edf0;background:rgba(9,17,24,.84);padding:6px 9px;border:1px solid rgba(255,255,255,.14);border-radius:6px;white-space:nowrap}#loading{position:absolute;inset:0;z-index:9;display:grid;place-items:center;background:#0b141c;color:#eef4f6}
.controls{padding:15px;background:#fbfcfc}.controls h2{font-size:15px;margin:0 0 4px}.controls>p{font-size:11px;color:var(--muted);line-height:1.5;margin:0 0 10px}#host{display:grid;grid-template-columns:1fr;gap:8px}.row{min-width:0;padding:9px;border:1px solid var(--line);border-radius:9px;background:#fff}.row label{display:flex;justify-content:space-between;gap:6px;color:#4f626a;font-size:10px}.row output{color:var(--cyan);font-weight:700}.row input{width:100%;height:44px;accent-color:var(--cyan);margin:0}.row select{width:100%;margin-top:7px}.readouts{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.readout{min-width:0;padding:8px;background:#eef3f4;border:1px solid var(--line);border-radius:8px}.readout span{display:block;font-size:9px;color:var(--muted)}.readout b{font-size:13px;color:#9b6219;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.model-note{padding:14px 16px;border-top:3px solid var(--cyan)}.model-note::before{content:"E  从画面回到不变关系";display:block;margin-bottom:7px;font-size:10px;font-weight:700;letter-spacing:.1em;color:#397080}.insight{font:15px/1.6 "STKaiti","KaiTi",serif;color:#294650}.term{font-size:11px;line-height:1.65;color:#52676f;margin-top:7px}.term::before{content:"模型边界：";font-weight:700;color:#9b6219}
@media(max-width:860px){body{padding:8px}.lab-shell{grid-template-columns:1fr}.scene-panel,.controls{grid-column:1}#scene{height:470px}#host{grid-template-columns:repeat(3,minmax(0,1fr))}.readouts{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:560px){.scene-head{padding:12px}.scene-head h1{font-size:18px}.scene-head p{font-size:11px}#scene{height:390px}#host{grid-template-columns:repeat(2,minmax(0,1fr))}.readouts{grid-template-columns:repeat(2,minmax(0,1fr))}.note{display:none}.label{font-size:9px}.controls,.model-note{padding:12px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main class="lab-shell">
<section class="learning-slot" data-learning-cycle-mount=""></section>
<section aria-labelledby="title" class="scene-panel" data-lab-scene=""><header class="scene-head"><div class="eyebrow" id="eyebrow">3D BRIDGE SYSTEMS ATLAS</div><h1 id="title"></h1><p id="lead"></p><p class="scene-task"><strong>观察要点：</strong><span id="question"></span></p><div class="toolbar"><button class="active" id="forces" type="button">隐藏受力图</button><button class="active" id="labels" type="button">隐藏标注</button><button id="view" type="button">重置视角</button></div></header><div id="scene"><div id="loading">正在建立三维桥型……</div><div class="note">左键旋转 · 滚轮缩放 · 右键平移｜变形经放大，数量为概念模型</div></div></section>
<aside aria-labelledby="control-title" class="controls" data-lab-controls=""><h2 id="control-title">改一个条件，看一条因果链</h2><p>先只动一个滑杆，再核对受力、变形和边界是否同时说得通。</p><div id="host"></div><div class="readouts" id="readouts"></div></aside>
<section class="learning-result" data-learning-result-mount=""></section>
<section class="model-note"><div class="insight" id="insight"></div><div class="term" id="term"></div></section>
</main>
<script defer="" src="./bundles/ch01-bridge-systems-atlas.bundle.js"></script><script>
addEventListener('DOMContentLoaded',()=>{const mode=new URLSearchParams(location.search).get('mode')||'beam',rows=[...document.querySelectorAll('#host .row')];const input=i=>rows[i]?.querySelector('input');const add=(i,fn)=>{const row=rows[i],el=document.createElement('div');el.style.cssText='margin-top:4px;font-size:10px;line-height:1.35;color:#397080';el.setAttribute('aria-live','polite');row?.append(el);const update=()=>{const r=fn();el.textContent=r.ok?'✓ 常规教学区：可比较受力趋势。':'⚠ 极端对照：只作概念比较，不能据此判断可行性。';el.style.color=r.ok?'#397080':'#b5503f'};input(i)?.addEventListener('input',update);update()};if(mode==='beam')add(2,()=>{const q=+input(0).value/+input(2).value;return{ok:q>=15&&q<=25}});if(mode==='arch')add(2,()=>{const q=+input(2).value/+input(0).value;return{ok:q>=1/6&&q<=1/3}});if(mode==='suspension')add(2,()=>{const q=+input(2).value/+input(0).value;return{ok:q>=1/12&&q<=1/8}});if(mode==='cable'){add(2,()=>{const q=+input(2).value;return{ok:q>=.35&&q<=.45}});add(3,()=>{const q=+input(3).value/+input(0).value;return{ok:q>=.20&&q<=.25}})}});
</script><script src="./learning-cycle.js"></script><script>
addEventListener('DOMContentLoaded',()=>{const mode=new URLSearchParams(location.search).get('mode')||'beam';const copy={beam:['梁桥体系参数图','跨径与梁高共同影响跨高比、截面效率和变形趋势。','调整主梁高度，核对跨高比、变形趋势与构造代价。'],arch:['拱桥体系参数图','矢跨比、荷载对称性与拱脚约束共同影响轴力和弯矩。','调整矢高和非对称荷载，比较压力路径。'],suspension:['悬索桥体系参数图','垂跨比和加劲梁刚度共同影响主缆水平分力与桥面变形。','调整主缆垂度，比较水平分力与变形。'],cable:['斜拉桥体系参数图','边主跨比例、塔高和索布置共同决定索塔梁耦合响应。','调整体系比例，观察塔、梁和索的受力变化。'],supports:['支承体系参数图','支座决定水平力与强迫位移的传递和释放。','改变温差与支承约束，核对位移和力流。'],construction:['施工阶段参数图','悬臂施工中体系、荷载和控制截面随阶段变化。','改变节段数和不平衡状态，比较桥墩响应。']}[mode]||['桥梁体系参数图','参数变化与结构响应同步显示。','调整参数并核对受力、变形和边界。'];document.title='桥梁结构体系三维图谱';document.getElementById('title').textContent=copy[0];document.getElementById('lead').textContent=copy[1];document.getElementById('question').textContent=copy[2];document.querySelector('.scene-task strong').textContent='观察要点：';document.getElementById('control-title').textContent='参数与响应';document.querySelector('.controls>p').textContent='每次改变一个主要参数，核对构造、受力和变形是否保持一致。';});
</script><script defer="" src="./bridge-a11y.js"></script>
