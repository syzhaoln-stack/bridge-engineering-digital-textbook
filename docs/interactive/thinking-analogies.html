<html lang="zh-CN"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>同一个原理，三个跨课程类比</title><link href="data:," rel="icon"/><link href="core-lab/style.css" rel="stylesheet"/><style>main{max-width:1300px;margin:auto;padding:28px}nav{display:flex;flex-wrap:wrap;gap:10px}nav button[aria-selected=true]{background:#176ea0;color:white}.pair{display:grid;grid-template-columns:1fr 1fr;gap:24px}.pair article{padding:20px;background:#f1f5f8;border-radius:14px}.pair svg{width:100%;background:white}.metric{font-size:20px;font-weight:650}.warning{color:#9b4f13}pre{white-space:pre-wrap;overflow-wrap:anywhere;padding:20px;background:#edf2f6}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #c8d5df}.control{display:flex;gap:15px;align-items:center;margin:24px 0}.control input[type=range]{flex:1}.control input[type=number]{width:100px}@media(max-width:700px){main{padding:15px}.pair{grid-template-columns:1fr}.control{flex-wrap:wrap}}</style></head><body>
<header><a href="../core-thinking.html">← 核心思维导读</a><span>跨课程并排比较</span></header><main><p class="eyebrow">保留共同原理，同时画出类比的边界</p><h1>换一个对象，哪些推理仍然成立？</h1><nav aria-label="选择类比"><button aria-selected="true" data-tab="eccentric">偏心受压 ↔ 横向分配</button><button data-tab="form">合理拱轴 ↔ 柔索平衡</button><button data-tab="scale">同样放大 ↔ 不同加载规则</button></nav><h2 id="topic"></h2><p id="lead"></p><div class="control"><label for="parameter" id="parameter-label"></label><input id="parameter" type="range"/><input aria-label="精确输入参数" id="number" type="number"/><button id="reset">恢复初始值</button></div><div id="stage"></div><p class="insight" id="boundary"></p><section><h2>先用一个反例检验类比</h2><p id="question"></p><textarea id="answer" placeholder="先写自己的判断，再展开核对思路。" rows="3"></textarea><details><summary>展开核对思路</summary><p id="explanation"></p></details><button id="save-answer">导出这次比较</button><p id="saved" role="status"></p></section><section><h2>这两幅图共用的计算代码</h2><pre><code id="code"></code></pre><p>数值采用无量纲归一化；具体单位、荷载定义与边界条件须在实际问题中重新声明。</p></section></main><script src="core-lab/analogies.js"></script>
