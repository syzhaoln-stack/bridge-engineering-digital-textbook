<!DOCTYPE html>

<html lang="zh-CN"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>偏心受压与截面核心</title><link href="bridge-lab.css" rel="stylesheet"/><style>
.direct-controls{display:grid;grid-template-columns:repeat(4,minmax(140px,1fr));gap:12px;margin-bottom:14px}.direct-controls .control{margin:0;background:#fff;border:1px solid var(--line);border-radius:7px;padding:10px}.full{grid-column:1/-1}.visual{padding:12px}.visual svg{touch-action:none}.status{font-weight:650;color:var(--green)}.status.tension{color:var(--orange)}@media(max-width:760px){.direct-controls{grid-template-columns:1fr 1fr}}@media(max-width:440px){.direct-controls{grid-template-columns:1fr}}
</style></head>
<body><main>
<header><div><h1>偏心受压与截面核心</h1><p>拖动截面中的合力作用点，观察双向偏心、角点应力及截面是否出现拉应力。</p></div><div class="toolbar"><button id="reset">作用点归心</button><button id="export">导出当前图（SVG）</button></div></header>
<section class="direct-controls">
<div class="control"><label for="N"><span>轴向压力 N</span><output id="N-out"></output></label><input data-unit=" kN" id="N" max="12000" min="1000" step="250" type="range" value="6000"/></div>
<div class="control"><label for="b"><span>截面宽度 b</span><output id="b-out"></output></label><input data-unit=" m" id="b" max="5" min="1" step="0.1" type="range" value="3"/></div>
<div class="control"><label for="h"><span>截面高度 h</span><output id="h-out"></output></label><input data-unit=" m" id="h" max="6" min="1" step="0.1" type="range" value="4"/></div>
<div class="control"><span>材料力学判别</span><div aria-live="polite" class="status" id="status">全截面受压</div></div>
</section>
<section class="visual"><svg aria-label="可拖动作用点的矩形截面核心与角点应力" class="figure" id="scene" role="img" viewbox="0 0 900 500"></svg>
<div class="metrics" id="metrics"></div><div class="formula">压应力取正：σ(y,z)=N/A+(Ne<sub>z</sub>)z/I<sub>y</sub>+(Ne<sub>y</sub>)y/I<sub>z</sub>。矩形截面无拉应力核心：|e<sub>y</sub>|/(b/6)+|e<sub>z</sub>|/(h/6)≤1。</div>
<div class="boundary">术语边界：本页判断“合力是否位于截面核心内”。钢筋混凝土大偏心受压与小偏心受压按极限状态的应变协调和破坏形态区分；钢构件还需验算压弯稳定，二者均不能以 b/6 或 h/6 直接替代。</div></section>
</main><script src="bridge-lab-utils.js"></script><script>
const svg=document.getElementById('scene'),metrics=document.getElementById('metrics'),statusEl=document.getElementById('status'),NS='http://www.w3.org/2000/svg';const state={N:6000,b:3,h:4,ey:0,ez:0};
function el(tag,a={},t=''){const n=document.createElementNS(NS,tag);Object.entries(a).forEach(([k,v])=>n.setAttribute(k,v));if(t)n.textContent=t;svg.appendChild(n);return n}
const box={x:70,y:55,w:360,h:360};
function modelToScreen(ey,ez){return{x:box.x+box.w/2+ey/state.b*box.w,y:box.y+box.h/2-ez/state.h*box.h}}
function screenToModel(x,y){return{ey:(x-(box.x+box.w/2))/box.w*state.b,ez:((box.y+box.h/2)-y)/box.h*state.h}}
function stress(y,z){const A=state.b*state.h,Iy=state.b*state.h**3/12,Iz=state.h*state.b**3/12;return state.N/A+state.N*state.ez*z/Iy+state.N*state.ey*y/Iz}
function render(){svg.innerHTML='';const kx=state.b/6,ky=state.h/6;el('rect',{x:box.x,y:box.y,width:box.w,height:box.h,fill:'#f8fbfc',stroke:'#183342','stroke-width':3});el('line',{x1:box.x,y1:box.y+box.h/2,x2:box.x+box.w,y2:box.y+box.h/2,class:'axis','stroke-dasharray':'5 4'});el('line',{x1:box.x+box.w/2,y1:box.y,x2:box.x+box.w/2,y2:box.y+box.h,class:'axis','stroke-dasharray':'5 4'});const kr=[modelToScreen(0,ky),modelToScreen(kx,0),modelToScreen(0,-ky),modelToScreen(-kx,0)];el('polygon',{points:kr.map(p=>`${p.x},${p.y}`).join(' '),fill:'#dcefe9',stroke:'#2d7b68','stroke-width':2});el('text',{x:box.x+box.w/2,y:box.y+box.h/2+5,'text-anchor':'middle',class:'small'},'截面核心');const p=modelToScreen(state.ey,state.ez);el('circle',{id:'load-point',cx:p.x,cy:p.y,r:13,fill:'#c7632d',stroke:'#fff','stroke-width':3,style:'cursor:grab',tabindex:'0',role:'slider','aria-label':'轴向压力作用点','aria-valuetext':`e_y=${state.ey.toFixed(2)} m，e_z=${state.ez.toFixed(2)} m`});el('line',{x1:p.x,y1:box.y-28,x2:p.x,y2:p.y-15,class:'force','marker-end':'url(#none)'});el('text',{x:p.x+15,y:p.y-16,class:'label'},'N');el('text',{x:box.x+box.w/2,y:447,'text-anchor':'middle',class:'label'},'拖动红点；方向键微调作用线位置');el('text',{x:box.x+box.w/2,y:475,'text-anchor':'middle',class:'small'},`eᵧ=${state.ey.toFixed(2)} m，e_z=${state.ez.toFixed(2)} m`);
  const corners=[[-state.b/2,state.h/2,'左上'],[state.b/2,state.h/2,'右上'],[state.b/2,-state.h/2,'右下'],[-state.b/2,-state.h/2,'左下']].map(([y,z,n])=>[n,stress(y,z)]);const vals=corners.map(x=>x[1]),min=Math.min(...vals),max=Math.max(...vals),lim=Math.max(Math.abs(min),Math.abs(max),1);const x0=540,y0=250,barW=54,gap=28;el('line',{x1:500,y1:y0,x2:865,y2:y0,class:'axis'});el('text',{x:680,y:45,'text-anchor':'middle',class:'label'},'四角应力（压为正，拉为负） / MPa');corners.forEach(([name,v],i)=>{const x=x0+i*(barW+gap),hv=Math.abs(v)/lim*155/1000*1000;const px=Math.min(155,Math.abs(v)/lim*155),y=v>=0?y0-px:y0;el('rect',{x,y,width:barW,height:px,fill:v>=0?'#146c94':'#c7632d',opacity:.85});el('text',{x:x+barW/2,y:v>=0?y-8:y+px+18,'text-anchor':'middle',class:'small'},`${(v/1000).toFixed(2)}`);el('text',{x:x+barW/2,y:445,'text-anchor':'middle',class:'small'},name)});el('text',{x:683,y:477,'text-anchor':'middle',class:'small'},'蓝：压应力；橙：拉应力');
  const coreMeasure=Math.abs(state.ey)/kx+Math.abs(state.ez)/ky,allCompression=min>=-1e-8;statusEl.textContent=allCompression?'全截面受压':'截面出现拉应力';statusEl.className='status'+(allCompression?'':' tension');metrics.innerHTML=[['核心判别值',coreMeasure.toFixed(3)],['最小应力',`${(min/1000).toFixed(2)} MPa`],['最大压应力',`${(max/1000).toFixed(2)} MPa`],['作用点',allCompression?'核心内或边界':'核心外']].map(([k,v])=>`<div class="metric"><span>${k}</span><strong>${v}</strong></div>`).join('')}
let dragging=false,dragPointer=null;
svg.addEventListener('pointerdown',e=>{if(e.target.id!=='load-point')return;dragging=true;dragPointer=e.pointerId;svg.setPointerCapture(e.pointerId);e.preventDefault()});
svg.addEventListener('pointermove',e=>{if(!dragging||e.pointerId!==dragPointer)return;const q=svg.createSVGPoint();q.x=e.clientX;q.y=e.clientY;const m=q.matrixTransform(svg.getScreenCTM().inverse()),v=screenToModel(m.x,m.y);state.ey=Math.max(-state.b/2,Math.min(state.b/2,v.ey));state.ez=Math.max(-state.h/2,Math.min(state.h/2,v.ez));render()});
svg.addEventListener('keydown',e=>{if(e.target.id!=='load-point'||!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home'].includes(e.key))return;e.preventDefault();const step=e.shiftKey ? 0.05 : 0.01;if(e.key==='Home'){state.ey=0;state.ez=0}else if(e.key==='ArrowLeft')state.ey-=step;else if(e.key==='ArrowRight')state.ey+=step;else if(e.key==='ArrowUp')state.ez+=step;else if(e.key==='ArrowDown')state.ez-=step;state.ey=Math.max(-state.b/2,Math.min(state.b/2,state.ey));state.ez=Math.max(-state.h/2,Math.min(state.h/2,state.ez));render();document.getElementById('load-point').focus()});
function stopDrag(e){if(e.pointerId!==dragPointer)return;dragging=false;dragPointer=null}
svg.addEventListener('pointerup',stopDrag);svg.addEventListener('pointercancel',stopDrag);
for(const id of ['N','b','h'])bindRange(state,id,render);document.getElementById('reset').onclick=()=>{state.ey=state.ez=0;render()};document.getElementById('export').onclick=()=>exportSvg(svg,'偏心受压与截面核心.svg');render();
</script>
